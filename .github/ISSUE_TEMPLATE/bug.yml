---
name: Bug report
description: Report something that doesn't work as documented.
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Don't include real hostnames, IP addresses, or credentials. Use example.com and RFC 5737 addresses.
        For a security problem, use private vulnerability reporting instead of this form.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe what you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      description: For example, Rocky Linux 9 or Ubuntu 24.04.
    validations:
      required: true
  - type: input
    id: auditd-version
    attributes:
      label: auditd version
      description: The output of `auditctl -v`.
    validations:
      required: false
  - type: dropdown
    id: install-path
    attributes:
      label: How you ran auditd-kit
      options:
        - Shell scripts
        - Ansible
        - Other
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output or logs
      description: Paste the relevant output with any site details removed.
      render: text
    validations:
      required: false
