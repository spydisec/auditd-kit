---
name: integration

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  changes:
    uses: $/.github/workflows/changes.yml
    permissions:
      contents: read

  # install.sh, a second install, and rollback.sh on a real kernel, then a full audit disk.
  real-kernel:
    needs: changes
    # The job always runs, so each matrix entry reports under the full name that the ruleset
    # requires. When nothing relevant changed, its steps are skipped instead.
    if: always()
    env:
      AKIT_RUN: ${{ needs.changes.result != 'success' || needs.changes.outputs.runtime == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
        profile: [minimal, heavy]
    steps:
      - name: Require change detection
        env:
          DETECTION_RESULT: ${{ needs.changes.result }}
        run: test "$DETECTION_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: env.AKIT_RUN == 'true'
        with:
          persist-credentials: false
      - name: Real kernel test
        if: env.AKIT_RUN == 'true'
        env:
          PROFILE: ${{ matrix.profile }}
        run: sudo AKIT_CI_OK=yes sh tests/ci/real-kernel.sh "$PROFILE"

  # The same test in a RHEL-family VM, which the runner boots with KVM, so the rules load into
  # that system's own kernel.
  real-kernel-vm:
    name: real-kernel-vm (${{ matrix.system }})
    needs: changes
    if: always()
    env:
      AKIT_RUN: ${{ needs.changes.result != 'success' || needs.changes.outputs.runtime == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: centos-7
            image: https://cloud.centos.org/centos/7/images/CentOS-7-x86_64-GenericCloud.qcow2
            sums: https://cloud.centos.org/centos/7/images/sha256sum.txt
          - system: rocky-8
            image: https://dl.rockylinux.org/pub/rocky/8/images/x86_64/Rocky-8-GenericCloud-Base.latest.x86_64.qcow2
            sums: https://dl.rockylinux.org/pub/rocky/8/images/x86_64/Rocky-8-GenericCloud-Base.latest.x86_64.qcow2.CHECKSUM
          - system: rocky-9
            image: https://dl.rockylinux.org/pub/rocky/9/images/x86_64/Rocky-9-GenericCloud-Base.latest.x86_64.qcow2
            sums: https://dl.rockylinux.org/pub/rocky/9/images/x86_64/Rocky-9-GenericCloud-Base.latest.x86_64.qcow2.CHECKSUM
          - system: rocky-10
            image: https://dl.rockylinux.org/pub/rocky/10/images/x86_64/Rocky-10-GenericCloud-Base.latest.x86_64.qcow2
            sums: https://dl.rockylinux.org/pub/rocky/10/images/x86_64/Rocky-10-GenericCloud-Base.latest.x86_64.qcow2.CHECKSUM
    steps:
      - name: Require change detection
        env:
          DETECTION_RESULT: ${{ needs.changes.result }}
        run: test "$DETECTION_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: env.AKIT_RUN == 'true'
        with:
          persist-credentials: false
      - name: Real kernel test in a VM
        if: env.AKIT_RUN == 'true'
        env:
          IMAGE: ${{ matrix.image }}
          SUMS: ${{ matrix.sums }}
        run: sh tests/ci/vm-run.sh "$IMAGE" "$SUMS" heavy

  # install.sh --skip-load twice and rollback.sh --skip-load in each supported OS image.
  container-install:
    needs: changes
    # The job always runs, so each matrix entry reports under the full name that the ruleset
    # requires. When nothing relevant changed, its steps are skipped instead.
    if: always()
    env:
      AKIT_RUN: ${{ needs.changes.result != 'success' || needs.changes.outputs.runtime == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image:
          - "centos:7"
          - "rockylinux:8"
          - "rockylinux:9"
          - "rockylinux/rockylinux:10"
          - "ubuntu:18.04"
          - "ubuntu:20.04"
          - "ubuntu:22.04"
          - "ubuntu:24.04"
          - "ubuntu:26.04"
          # Not in the tested list of hostcheck.sh, so install must warn and go ahead.
          - "debian:12"
    steps:
      - name: Require change detection
        env:
          DETECTION_RESULT: ${{ needs.changes.result }}
        run: test "$DETECTION_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: env.AKIT_RUN == 'true'
        with:
          persist-credentials: false
      - name: Container install test
        if: env.AKIT_RUN == 'true'
        env:
          IMAGE: ${{ matrix.image }}
        run: sh tests/ci/container-install.sh "$IMAGE"
