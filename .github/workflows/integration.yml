---
name: integration

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  # install.sh, a second install, and rollback.sh on a real kernel, then forwarding to a TCP sink,
  # then a full audit disk.
  real-kernel:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        profile: [minimal, heavy]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Real kernel test
        env:
          PROFILE: ${{ matrix.profile }}
        run: sudo AKIT_CI_OK=yes sh tests/ci/real-kernel.sh "$PROFILE"

  # install.sh --skip-load twice and rollback.sh --skip-load in each supported OS image.
  container-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: ["centos:7", "rockylinux:8", "rockylinux:9", "rockylinux/rockylinux:10", "ubuntu:22.04", "ubuntu:24.04"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Container install test
        env:
          IMAGE: ${{ matrix.image }}
        run: sh tests/ci/container-install.sh "$IMAGE"

  molecule-survey:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: survey
            ansible-core: "ansible-core==2.16.*"
          - scenario: survey-latest
            ansible-core: "ansible-core"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install ansible-core and Molecule
        env:
          ANSIBLE_CORE: ${{ matrix.ansible-core }}
        run: |
          python -m venv .venv
          .venv/bin/pip install "$ANSIBLE_CORE" -r tests/molecule/requirements.txt
      - name: Build and install the collection
        run: |
          PATH="$PWD/.venv/bin:$PATH" sh scripts/dev/build-collection.sh "$RUNNER_TEMP/dist"
          .venv/bin/ansible-galaxy collection install -p "$RUNNER_TEMP/collections" \
            "$RUNNER_TEMP"/dist/spydisec-auditd_kit-*.tar.gz
          .venv/bin/ansible-galaxy collection install -p "$RUNNER_TEMP/collections" \
            -r tests/molecule/requirements.yml
      - name: Molecule
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          cd tests
          export PATH="$PWD/../.venv/bin:$PATH" ANSIBLE_COLLECTIONS_PATH="$RUNNER_TEMP/collections"
          molecule test -s "$SCENARIO"
