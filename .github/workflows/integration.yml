---
name: integration

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  changes:
    uses: $/.github/workflows/changes.yml
    permissions:
      contents: read

  # install.sh, a second install, and rollback.sh on a real kernel, then a full audit disk.
  real-kernel:
    needs: changes
    # The job always runs, so each matrix entry reports under the full name that the ruleset
    # requires. When nothing relevant changed, its steps are skipped instead.
    if: always()
    env:
      AKIT_RUN: ${{ needs.changes.result != 'success' || needs.changes.outputs.runtime == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
        profile: [minimal, heavy]
    steps:
      - name: Require change detection
        env:
          DETECTION_RESULT: ${{ needs.changes.result }}
        run: test "$DETECTION_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: env.AKIT_RUN == 'true'
        with:
          persist-credentials: false
      - name: Real kernel test
        if: env.AKIT_RUN == 'true'
        env:
          PROFILE: ${{ matrix.profile }}
        run: sudo AKIT_CI_OK=yes sh tests/ci/real-kernel.sh "$PROFILE"

  # install.sh --skip-load twice and rollback.sh --skip-load in each supported OS image.
  container-install:
    needs: changes
    # The job always runs, so each matrix entry reports under the full name that the ruleset
    # requires. When nothing relevant changed, its steps are skipped instead.
    if: always()
    env:
      AKIT_RUN: ${{ needs.changes.result != 'success' || needs.changes.outputs.runtime == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image:
          - "centos:7"
          - "rockylinux:8"
          - "rockylinux:9"
          - "rockylinux/rockylinux:10"
          - "ubuntu:18.04"
          - "ubuntu:20.04"
          - "ubuntu:22.04"
          - "ubuntu:24.04"
          - "ubuntu:26.04"
    steps:
      - name: Require change detection
        env:
          DETECTION_RESULT: ${{ needs.changes.result }}
        run: test "$DETECTION_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: env.AKIT_RUN == 'true'
        with:
          persist-credentials: false
      - name: Container install test
        if: env.AKIT_RUN == 'true'
        env:
          IMAGE: ${{ matrix.image }}
        run: sh tests/ci/container-install.sh "$IMAGE"
