---
name: lint

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  changes:
    uses: $/.github/workflows/changes.yml
    permissions:
      contents: read

  lint:
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Require change detection
        env:
          DETECTION_RESULT: ${{ needs.changes.result }}
        run: test "$DETECTION_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: needs.changes.outputs.lint == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        if: needs.changes.outputs.lint == 'true'
        with:
          python-version: "3.12"
      - name: Install tools
        if: needs.changes.outputs.lint == 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip install -r tests/requirements.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Lint
        if: needs.changes.outputs.lint == 'true'
        run: sh tests/lint.sh

  bats:
    needs: changes
    if: >-
      always() && (needs.changes.result != 'success' || needs.changes.outputs.bats == 'true' ||
      needs.changes.outputs.packaging == 'true' || needs.changes.outputs.rules == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Require change detection
        env:
          DETECTION_RESULT: ${{ needs.changes.result }}
        run: test "$DETECTION_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43  # 4.0.0
        with:
          bats-version: 1.11.1
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        if: needs.changes.outputs.bats == 'true' || needs.changes.outputs.packaging == 'true'
        with:
          python-version: "3.12"
      - name: Install packaging tools
        if: needs.changes.outputs.bats == 'true' || needs.changes.outputs.packaging == 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip install 'ansible-core==2.16.*'
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Bats
        env:
          RUN_ALL: ${{ needs.changes.outputs.bats }}
          RUN_PACKAGING: ${{ needs.changes.outputs.packaging }}
          RUN_RULES: ${{ needs.changes.outputs.rules }}
        run: |
          if [ "$RUN_ALL" = true ]; then
            command -v ansible-galaxy
            bats tests/bats
          else
            set --
            if [ "$RUN_PACKAGING" = true ]; then
              command -v ansible-galaxy
              set -- "$@" tests/bats/collection.bats tests/bats/release.bats
            fi
            if [ "$RUN_RULES" = true ]; then
              set -- "$@" tests/bats/rules.bats
            fi
            bats "$@"
          fi

  # The suite again with sh as bash in POSIX mode, as on RHEL, and with mawk as awk, as on Ubuntu.
  bats-portability:
    needs: changes
    if: >-
      always() && (needs.changes.result != 'success' || needs.changes.outputs.bats == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Require change detection
        env:
          DETECTION_RESULT: ${{ needs.changes.result }}
        run: test "$DETECTION_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43  # 4.0.0
        with:
          bats-version: 1.11.1
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false
      - name: Install mawk
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mawk
      # Tests stub bash, so the shims call bash and mawk by their full paths.
      - name: Bats with sh as bash --posix
        run: |
          shim="$RUNNER_TEMP/posix-sh"
          mkdir -p "$shim"
          printf '#!/bin/sh\nexec %s --posix "$@"\n' "$(command -v bash)" >"$shim/sh"
          chmod +x "$shim/sh"
          export PATH="$shim:$PATH"
          [ -n "$(sh -c 'echo "${BASH_VERSION:-}"')" ]
          bats tests/bats
      - name: Bats with mawk as awk
        run: |
          shim="$RUNNER_TEMP/mawk"
          mkdir -p "$shim"
          printf '#!/bin/sh\nexec %s "$@"\n' "$(command -v mawk)" >"$shim/awk"
          chmod +x "$shim/awk"
          export PATH="$shim:$PATH"
          awk -W version 2>&1 | grep -q mawk
          bats tests/bats
