---
name: release

# Run it by hand from the Actions tab on main, with the version to release. It builds the files,
# attests them, and creates the vX.Y.Z tag and the release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, as X.Y.Z"
        required: true
        type: string

permissions: {}

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          python -m venv .venv
          .venv/bin/pip install -r tests/requirements.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Build
        env:
          VERSION: ${{ inputs.version }}
        run: sh scripts/dev/build-release.sh "$VERSION" dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/get.sh
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" --title "v$VERSION" \
            --generate-notes
