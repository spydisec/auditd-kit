---
# The same settings as the script path (scripts/lib/settings.sh), with the same defaults.
# An empty value means "not set".
akit_profile: minimal
akit_size: standard
akit_max_log_file: ""
akit_num_logs: ""
akit_forward: none
akit_syslog_facility: local6
akit_immutable: false
akit_existing_rules: unset
akit_extra_rules_dir: ""
akit_accept: ""
akit_skip_keys: ""
