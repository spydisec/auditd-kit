# Managed by auditd-kit. Change the settings and run install.sh again instead of editing this file.
# This file handles only the local6 facility, which the auditd syslog plugin writes to.
global(maxMessageSize="64k")
if $syslogfacility-text == 'local6' then {
  action(
    type="omfwd"
    target="192.0.2.10"
    port="514"
    protocol="tcp"
    queue.type="LinkedList"
    queue.filename="auditd-kit"
    queue.maxDiskSpace="1g"
    queue.saveOnShutdown="on"
    action.resumeRetryCount="-1"
  )
  stop
}
