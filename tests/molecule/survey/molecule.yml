---
# The survey and stats playbooks on every supported system, with ansible-core 2.16.
driver:
  name: docker
platforms:
  - name: centos7
    image: centos:7
  - name: rocky8
    image: rockylinux:8
  - name: rocky9
    image: rockylinux:9
  - name: ubuntu2204
    image: ubuntu:22.04
  - name: ubuntu2404
    image: ubuntu:24.04
provisioner:
  name: ansible
scenario:
  # The survey reads live values such as free space, so the CSV differs on every run. Idempotence
  # of the hosts is checked in verify.yml instead of with a second converge.
  test_sequence:
    - destroy
    - create
    - prepare
    - converge
    - verify
    - destroy
