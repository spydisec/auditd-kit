---
# The survey and stats playbooks with ansible-core 2.16, on every supported system up to Ubuntu
# 24.04. ansible-core 2.16 doesn't support Python 3.14, which Ubuntu 26.04 ships.
driver:
  name: docker
# The images are used as they are. prepare.yml adds what Ansible needs.
platforms:
  - name: centos7
    image: centos:7
    pre_build_image: true
  - name: rocky8
    image: rockylinux:8
    pre_build_image: true
  - name: rocky9
    image: rockylinux:9
    pre_build_image: true
  - name: ubuntu1804
    image: ubuntu:18.04
    pre_build_image: true
  - name: ubuntu2004
    image: ubuntu:20.04
    pre_build_image: true
  - name: ubuntu2204
    image: ubuntu:22.04
    pre_build_image: true
  - name: ubuntu2404
    image: ubuntu:24.04
    pre_build_image: true
provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        # The containers run as root and have no sudo.
        ansible_become: false
scenario:
  # The survey reads live values such as free space, so the CSV differs on every run. Idempotence
  # of the hosts is checked in verify.yml instead of with a second converge.
  test_sequence:
    - destroy
    - create
    - prepare
    - converge
    - verify
    - destroy
